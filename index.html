<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スタンプカード印刷メーカー</title>
<style>
  :root {
    --bg: #7A2E3C;
    --surface: #FFFFFF;
    --text-heading: #F8EFF1;
    --text-main: #2B1F22;
    --text-sub: #6B5A5E;
    --accent: #14655C;
    --accent-text: #FFFFFF;
    --danger: #B3261E;
    --border-ui: #E0D6D8;
    --grid-line: #7A6A6E;
    --cut-line: #C9BEC1;
    --mm: 3.7795275591px; /* 1mm at 96dpi */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 16px 12px;
    background: var(--bg);
    color: var(--text-heading);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }

  main {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  h1 {
    font-size: 18px;
    margin: 0;
    color: var(--text-heading);
  }

  p.lead {
    margin: 0;
    color: var(--text-heading);
    font-size: 14px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  label {
    font-size: 14px;
    color: var(--text-heading);
  }

  input[type="text"],
  textarea {
    width: 100%;
    padding: 8px 12px;
    font-size: 16px;
    font-family: system-ui, sans-serif;
    color: var(--text-main);
    background: var(--surface);
    border: 1px solid var(--border-ui);
    border-radius: 6px;
  }

  textarea {
    resize: vertical;
    line-height: 1.5;
  }

  .radio-group {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border-ui);
    border-radius: 6px;
    padding: 8px 16px;
  }

  .radio-group label {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px;
    margin: 0;
    color: var(--text-main);
    font-size: 16px;
    white-space: nowrap;
  }

  .note-line {
    font-size: 13px;
    color: var(--text-heading);
    margin: 0;
  }

  #messageArea {
    min-height: 22px;
    background: var(--surface);
    border-radius: 6px;
    padding: 0 12px;
  }

  #messageArea:empty {
    padding: 0;
  }

  .warning-line {
    color: var(--danger);
    font-size: 14px;
    padding: 8px 0;
  }

  button#printBtn {
    display: block;
    width: 100%;
    min-height: 44px;
    padding: 8px 16px;
    font-size: 16px;
    font-family: system-ui, sans-serif;
    color: var(--accent-text);
    background: var(--accent);
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }

  button#printBtn:active {
    opacity: 0.85;
  }

  #previewLabel {
    font-size: 13px;
    color: var(--text-heading);
    margin: 0;
  }

  #previewOuter {
    border: 1px solid var(--border-ui);
    border-radius: 6px;
    background: var(--surface);
    overflow-x: auto;
    padding: 8px;
  }

  #previewWrapper {
    overflow: hidden;
  }

  #previewInner {
    transform-origin: top left;
  }

  .a4-page {
    background: #FFFFFF;
    box-shadow: 0 0 0 1px var(--border-ui);
    box-sizing: border-box;
    width: calc(210 * var(--mm));
    height: calc(297 * var(--mm));
    padding: calc(11 * var(--mm)) calc(14 * var(--mm));
  }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(2, calc(91 * var(--mm)));
    grid-template-rows: repeat(5, calc(55 * var(--mm)));
    border-top: 1px solid var(--cut-line);
    border-left: 1px solid var(--cut-line);
  }

  .card {
    box-sizing: border-box;
    border-right: 1px solid var(--cut-line);
    border-bottom: 1px solid var(--cut-line);
    padding: calc(4 * var(--mm)) calc(5 * var(--mm));
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-inner {
    width: calc(81 * var(--mm));
    height: calc(47 * var(--mm));
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .card-name {
    width: 100%;
    height: calc(6 * var(--mm));
    line-height: calc(6 * var(--mm));
    font-size: calc(4.5 * var(--mm));
    font-weight: bold;
    color: var(--text-main);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .stamp-area {
    width: 100%;
    height: calc(32 * var(--mm));
    margin-top: calc(2 * var(--mm));
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stamp-grid {
    display: grid;
    gap: calc(1.5 * var(--mm));
  }

  .stamp-cell {
    border: 1px solid var(--grid-line);
    border-radius: 0;
  }

  .card-reward {
    width: 100%;
    height: calc(5 * var(--mm));
    line-height: calc(5 * var(--mm));
    margin-top: calc(2 * var(--mm));
    font-size: calc(3.2 * var(--mm));
    color: var(--text-sub);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-inner.back {
    justify-content: center;
    align-items: flex-start;
  }

  .notes {
    width: 100%;
    max-height: calc(15.68 * var(--mm));
    overflow: hidden;
    font-size: calc(2.8 * var(--mm));
    line-height: 1.4;
    color: var(--text-sub);
    text-align: left;
  }

  .notes div {
    white-space: pre-wrap;
    word-break: break-all;
  }

  @media print {
    body, main {
      margin: 0;
      padding: 0;
      background: #FFFFFF;
    }
    main > *:not(#printSection) {
      display: none;
    }
    #previewOuter {
      border: none;
      padding: 0;
      overflow: visible;
    }
    #previewWrapper {
      width: auto !important;
      height: auto !important;
      overflow: visible !important;
    }
    #previewInner {
      transform: none !important;
    }
    .a4-page {
      width: 210mm !important;
      height: 297mm !important;
      padding: 11mm 14mm;
      box-shadow: none;
      margin: 0;
    }
    @page {
      size: A4;
      margin: 0;
    }
  }
</style>
</head>
<body>
<main>
  <h1>スタンプカード印刷メーカー</h1>
  <p class="lead">店名とマス数を決めると、名刺サイズのスタンプカードがA4に10枚並びます</p>

  <div class="field">
    <label for="storeName">店名</label>
    <input type="text" id="storeName" maxlength="16" placeholder="例: cafe ななつ星">
  </div>

  <div class="radio-group" id="countGroup">
    <label><input type="radio" name="stampCount" value="5"> 5マス</label>
    <label><input type="radio" name="stampCount" value="10" checked> 10マス</label>
    <label><input type="radio" name="stampCount" value="15"> 15マス</label>
  </div>

  <div class="field">
    <label for="rewardText">特典文</label>
    <input type="text" id="rewardText" maxlength="24">
  </div>

  <div class="radio-group" id="faceGroup">
    <label><input type="radio" name="face" value="front" checked> 表面</label>
    <label><input type="radio" name="face" value="back"> 裏面</label>
  </div>

  <div class="field" id="notesField" style="display:none;">
    <label for="notesInput">裏面の注意書き（4行・1行24字まで）</label>
    <textarea id="notesInput" rows="4"></textarea>
  </div>

  <p class="note-line">印刷設定は「用紙サイズ: A4」「余白: なし」「倍率: 100%」にしてください</p>
  <p class="note-line">両面にする場合は、表面を印刷 → 用紙を戻して「裏面」に切り替えて印刷してください</p>

  <div id="messageArea"></div>

  <div id="printSection">
    <p id="previewLabel">※ 実際の大きさはブラウザの印刷プレビューで確認してください</p>
    <div id="previewOuter">
      <div id="previewWrapper">
        <div id="previewInner"></div>
      </div>
    </div>
  </div>

  <button id="printBtn" type="button">印刷する</button>
</main>

<script>
(function () {
  var storeNameInput = document.getElementById('storeName');
  var rewardTextInput = document.getElementById('rewardText');
  var notesInput = document.getElementById('notesInput');
  var notesField = document.getElementById('notesField');
  var messageArea = document.getElementById('messageArea');
  var printBtn = document.getElementById('printBtn');
  var previewOuter = document.getElementById('previewOuter');
  var previewWrapper = document.getElementById('previewWrapper');
  var previewInner = document.getElementById('previewInner');

  var MM = 3.7795275591; // px per mm at 96dpi
  var A4_W_MM = 210, A4_H_MM = 297;
  var CARD_COUNT = 10; // 2列×5行 固定

  var STAMP_CONFIG = {
    '5': { cols: 5, rows: 1, cell: 15 },
    '10': { cols: 5, rows: 2, cell: 15 },
    '15': { cols: 5, rows: 3, cell: 9.6 }
  };

  var DEFAULT_REWARD = 'スタンプ10個で ドリンク1杯サービス';
  var DEFAULT_NOTES = [
    '・1回のお会計でスタンプ1個押します',
    '・他のサービスとの併用はできません',
    '・紛失・盗難の場合の再発行はできません'
  ].join('\n');

  var lastScale = 1;

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function getStampCount() {
    var checked = document.querySelector('input[name="stampCount"]:checked');
    return checked ? checked.value : '10';
  }

  function getFace() {
    var checked = document.querySelector('input[name="face"]:checked');
    return checked ? checked.value : 'front';
  }

  function buildStampGridHtml(count) {
    var config = STAMP_CONFIG[count];
    var cellPx = config.cell * MM;
    var html = '<div class="stamp-grid" style="grid-template-columns:repeat(' + config.cols + ',' + cellPx + 'px);grid-template-rows:repeat(' + config.rows + ',' + cellPx + 'px);">';
    var total = config.cols * config.rows;
    for (var i = 0; i < total; i++) {
      html += '<div class="stamp-cell"></div>';
    }
    html += '</div>';
    return html;
  }

  function buildFrontCardHtml(name, reward, stampGridHtml) {
    return '<div class="card"><div class="card-inner">' +
      '<div class="card-name">' + escapeHtml(name) + '</div>' +
      '<div class="stamp-area">' + stampGridHtml + '</div>' +
      '<div class="card-reward">' + escapeHtml(reward) + '</div>' +
      '</div></div>';
  }

  function buildBackCardHtml(noteLines) {
    var linesHtml = '';
    for (var i = 0; i < noteLines.length; i++) {
      linesHtml += '<div>' + escapeHtml(noteLines[i]) + '</div>';
    }
    return '<div class="card"><div class="card-inner back">' +
      '<div class="notes">' + linesHtml + '</div>' +
      '</div></div>';
  }

  // 警告・エラーを判定する。複数同時に出ることがあるため配列で返す。
  function collectMessages(name, notesRaw, face) {
    var messages = [];

    if (name.trim() === '') {
      messages.push('⚠ 店名を入力してください');
    }

    if (face === 'back') {
      var lines = notesRaw.split(/\r\n|\r|\n/);
      var tooManyLines = lines.length > 4;
      var tooLongLine = false;
      for (var i = 0; i < lines.length; i++) {
        if (lines[i].length > 24) {
          tooLongLine = true;
          break;
        }
      }
      if (tooManyLines || tooLongLine) {
        messages.push('⚠ 注意書きは4行・1行24字までです（はみ出した分は印刷されません）');
      }
    }

    return messages;
  }

  function render() {
    var name = storeNameInput.value;
    var reward = rewardTextInput.value;
    var count = getStampCount();
    var face = getFace();
    var notesRaw = notesInput.value;

    notesField.style.display = (face === 'back') ? '' : 'none';

    var messages = collectMessages(name, notesRaw, face);
    if (messages.length > 0) {
      var msgHtml = '';
      for (var m = 0; m < messages.length; m++) {
        msgHtml += '<div class="warning-line">' + escapeHtml(messages[m]) + '</div>';
      }
      messageArea.innerHTML = msgHtml;
    } else {
      messageArea.innerHTML = '';
    }

    var cardHtml;
    if (face === 'front') {
      var stampGridHtml = buildStampGridHtml(count);
      cardHtml = buildFrontCardHtml(name, reward, stampGridHtml);
    } else {
      var noteLines = notesRaw.split(/\r\n|\r|\n/);
      cardHtml = buildBackCardHtml(noteLines);
    }

    var gridHtml = '<div class="card-grid">';
    for (var c = 0; c < CARD_COUNT; c++) {
      gridHtml += cardHtml;
    }
    gridHtml += '</div>';

    var pageHtml = '<div class="a4-page">' + gridHtml + '</div>';

    previewInner.innerHTML = pageHtml;

    applyScale();
  }

  function applyScale() {
    var containerWidth = previewOuter.clientWidth - 16; // padding分を引く
    if (containerWidth <= 0) {
      previewInner.style.transform = 'scale(' + lastScale + ')';
      return;
    }

    var actualWidth = A4_W_MM * MM;
    var scale = containerWidth / actualWidth;
    if (!isFinite(scale) || scale <= 0) {
      scale = lastScale > 0 ? lastScale : 0.3;
    }
    scale = Math.min(scale, 1);

    lastScale = scale;

    var actualHeightPx = A4_H_MM * MM;

    previewInner.style.transform = 'scale(' + scale + ')';
    previewWrapper.style.width = (actualWidth * scale) + 'px';
    previewWrapper.style.height = (actualHeightPx * scale) + 'px';
  }

  storeNameInput.addEventListener('input', render);
  rewardTextInput.addEventListener('input', render);
  notesInput.addEventListener('input', render);
  document.getElementById('countGroup').addEventListener('change', render);
  document.getElementById('faceGroup').addEventListener('change', render);
  printBtn.addEventListener('click', function () {
    window.print();
  });
  window.addEventListener('resize', applyScale);

  // 初期表示
  rewardTextInput.value = DEFAULT_REWARD;
  notesInput.value = DEFAULT_NOTES;
  render();
})();
</script>
</body>
</html>
